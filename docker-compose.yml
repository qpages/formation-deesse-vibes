services:
  postgres:
    image: postgres:16-alpine
    container_name: formation-deesse-vibes-db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: deesse
      POSTGRES_PASSWORD: deesse
      POSTGRES_DB: formation_deesse_vibes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deesse -d formation_deesse_vibes']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
